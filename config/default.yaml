# ============================================================
# Dhan Algo Trading System — Master Configuration (v2.0)
# Production-grade EMA strategy for options buying
# ============================================================

# --- Underlying Symbol ---
symbol: NIFTY
exchange: IDX_I
instrument_type: INDEX
security_id: "13"
expiry: ""
timeframe: 5m
lookback_candles: 200

# --- EMA Configuration (quad-EMA stack) ---
ema:
  primary_period: 7             # Fast trigger
  short_period: 9               # Short confirmation
  long_period: 21               # Trend direction
  trend_period: 50              # Macro trend filter
  use_crossover_confirmation: true

# --- Multi-Timeframe Analysis ---
multi_timeframe:
  enabled: true
  higher_tf_minutes: 15         # 5m trades confirmed by 15m bias
  require_htf_alignment: true   # Block trades against HTF trend
  htf_ema_period: 21

# --- Entry Rules ---
entry:
  mode: both                    # breakout | pullback | both
  confirm_candle_close: true
  volume_confirmation: false
  volume_multiplier: 1.5
  min_grade: "A"                # Minimum trade grade: A+, A, B, C
  cooldown_bars: 3              # Wait N bars after a signal before next
  max_entries_per_direction: 2

# --- Sideways Market Filter (combined multi-method) ---
sideways_filter:
  enabled: true
  method: combined              # atr | candle_range | combined
  atr_period: 14
  atr_threshold: 0.08           # ATR % of price (lower = more permissive)
  candle_range_min: 0.05
  ema_flat_lookback: 10         # Bars to check EMA slope
  ema_flat_threshold: 0.005     # EMA slope < this = flat market
  range_bound_lookback: 20      # Bars to check price range
  range_bound_pct: 1.0          # Range < this % = consolidation
  atr_expansion_lookback: 5
  atr_expansion_factor: 1.1

# --- Options (You are an option BUYER) ---
options:
  enabled: true
  strike_selection: atm
  strike_offset: 0
  fixed_strike: 0
  expiry_preference: weekly
  strike_interval: 50           # NIFTY=50, BANKNIFTY=100
  premium_sl_pct: 20            # SL: exit if premium drops 20%
  premium_target_pct: 30        # TP: exit at 30% profit on premium
  use_premium_based_sl: true
  min_premium: 50               # Avoid illiquid penny options
  max_premium: 500              # Avoid expensive deep ITM
  avoid_last_hour_entry: true   # Theta decay protection
  theta_decay_exit_minutes: 45  # Minutes before close to avoid entry

# --- Exit Strategy ---
exit:
  stop_loss:
    type: fixed_points
    value: 30
  target:
    type: risk_reward
    risk_reward_ratio: 1.5
    value: 100
  trailing_sl:
    enabled: true
    activation_pct: 12           # Start trailing after 12% premium profit
    trail_pct: 5                 # Trail 5% below peak premium
  partial_exit:
    enabled: true
    first_target_pct: 15         # Book partial at 15% profit
    first_exit_fraction: 0.5     # Exit 50% of position
    move_sl_to_cost: true        # Move SL to entry price after partial
  time_based_exit:
    enabled: true
    exit_time: "15:15"
  exit_on_opposite_signal: true

# --- Risk Management ---
risk:
  max_trades_per_day: 10          # Reduced from 10 — quality over quantity
  max_loss_per_day: 2000
  capital_per_trade: 20000
  lot_size: 65                   # NIFTY lot size
  max_open_positions: 1
  risk_per_trade_pct: 2.0
  cooldown_after_loss: 2         # Wait N bars after a losing trade
  max_consecutive_losses: 3      # Stop trading after 3 consecutive losses

# --- Indian Brokerage Model ---
brokerage:
  enabled: true
  brokerage_per_order: 20.0      # Flat ₹20 per order (Zerodha/Dhan)
  stt_pct: 0.0625               # STT on sell side only for options
  exchange_txn_pct: 0.0019       # NSE exchange charges
  gst_pct: 18.0                  # GST on brokerage + exchange charges
  sebi_per_crore: 10.0           # SEBI turnover fee
  stamp_duty_pct: 0.003          # Stamp duty on buy side

# --- Trading Hours (IST) ---
trading_hours:
  start: "09:20"
  end: "14:30"
  force_exit: "15:25"

# --- Logging ---
logging:
  level: INFO
  console: true
  file: true
  log_dir: logs

# --- Telegram Alerts ---
telegram:
  enabled: true
  on_entry: true
  on_exit: true
  on_error: true
  daily_summary: true

# --- Webhook / Postback ---
webhook:
  enabled: false
  host: "0.0.0.0"
  port: 8443
  auth_token: ""
  log_all_updates: true

# --- Paper Trading ---
paper_trading:
  initial_capital: 20000
  slippage_pct: 0.1              # 0.1% simulated slippage

# --- Backtest ---
backtest:
  data_source: dhan
  csv_path: ""
  start_date: "2025-01-01"
  end_date: "2025-12-31"
  initial_capital: 20000
  commission_per_trade: 20       # Legacy fallback (brokerage model preferred)
  next_candle_entry: true        # Signal on bar N → entry on bar N+1 open
  slippage_pct: 0.1              # 0.1% adverse slippage on entry and exit
